# /etc/nginx/sites-available/daddymoto.com
# Symlink: ln -s /etc/nginx/sites-available/daddymoto.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name daddymoto.com www.daddymoto.com;

    # Redirect www → non-www
    if ($host = www.daddymoto.com) {
        return 301 https://daddymoto.com$request_uri;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://daddymoto.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daddymoto.com;

    # SSL — issued by certbot
    ssl_certificate     /etc/letsencrypt/live/daddymoto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daddymoto.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → non-www (HTTPS)
    if ($host = www.daddymoto.com) {
        return 301 https://daddymoto.com$request_uri;
    }

    # Logging
    access_log /var/log/nginx/daddymoto.access.log;
    error_log  /var/log/nginx/daddymoto.error.log;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block" always;

    # Proxy to Next.js app running on port 3004
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache static Next.js assets
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3004;
        proxy_set_header Host $host;
        expires          1y;
        add_header       Cache-Control "public, immutable";
    }

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
